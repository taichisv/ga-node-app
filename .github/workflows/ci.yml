name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run unit/integration tests
      run: npm test

    - name: Build Docker image
      run: docker build -t ga-node-app .

    - name: Run Docker container and E2E tests
      run: |
      # 1. バックグラウンドでDockerコンテナを起動
        docker run -d -p 3000:3000 --name memo-container ga-node-app
        # コンテナが起動し、正しくAPI応答を返すかcurlで確認
        sleep 3
      # 2. Playwrightのブラウザ環境のセットアップとテスト実行
        npx playwright install --with-deps
        npx playwright test

    - name: Upload Screenshots on failure or success
      uses: actions/upload-artifact@v4
      if: always() # テストが成功しても失敗してもアップロードする
      with:
        name: e2e-screenshots
        path: test-results/