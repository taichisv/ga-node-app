<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>一言掲示板</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        ul { padding-left: 20px; }
        input { padding: 6px; width: 70%; }
        button { padding: 6px 12px; }
    </style>
</head>
<body>
    <h1>一言掲示板 (CI/CD Sample)</h1>
    <div>
        <input type="text" id="memoInput" placeholder="メモを入力...">
        <button onclick="addMemo()">投稿</button>
    </div>
    <ul id="memoList"></ul>

    <script>
        let latestMemos = [];
        let editingMemoId = null;
        let editingMemoText = '';
        let editingError = '';

        function escapeHtml(text) {
            return String(text)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        async function fetchMemos() {
            const res = await fetch('/api/memos');
            const memos = await res.json();
            latestMemos = memos;
            const list = document.getElementById('memoList');
            list.innerHTML = memos.map((m) => {
                if (editingMemoId === m.id) {
                    return `
                        <li>
                            <input type="text" id="editMemoInput-${m.id}" value="${escapeHtml(editingMemoText)}">
                            <button onclick="saveMemoEdit(${m.id})">保存</button>
                            <button onclick="cancelMemoEdit()">キャンセル</button>
                            ${editingError ? `<div style="color: red; margin-top: 4px;">${escapeHtml(editingError)}</div>` : ''}
                        </li>
                    `;
                }
                return `<li>${escapeHtml(m.text)} <button onclick="startMemoEdit(${m.id})">訂正</button> <button onclick="deleteMemo(${m.id})">削除</button></li>`;
            }).join('');
        }

        async function addMemo() {
            const input = document.getElementById('memoInput');
            const text = input.value;
            if (!text) return;

            await fetch('/api/memos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            input.value = '';
            fetchMemos();
        }

        async function deleteMemo(id) {
            await fetch(`/api/admin/memos/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin': 'true' }
            });
            fetchMemos();
        }

        function startMemoEdit(id) {
            const memo = latestMemos.find((item) => item.id === id);
            if (!memo) return;
            editingMemoId = id;
            editingMemoText = memo.text;
            editingError = '';
            fetchMemos();
        }

        function cancelMemoEdit() {
            editingMemoId = null;
            editingMemoText = '';
            editingError = '';
            fetchMemos();
        }

        async function saveMemoEdit(id) {
            const input = document.getElementById(`editMemoInput-${id}`);
            const rawText = input ? input.value : '';
            editingMemoText = rawText;
            const text = rawText.trim();

            if (!text) {
                editingError = '本文を入力してください';
                fetchMemos();
                return;
            }

            const res = await fetch(`/api/memos/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });

            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                editingError = data.error || '保存に失敗しました';
                fetchMemos();
                return;
            }

            editingMemoId = null;
            editingMemoText = '';
            editingError = '';
            fetchMemos();
        }

        fetchMemos();
    </script>
</body>
</html>
